name: CICD

on:
  pull_request:
    branches:
      - dev

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Show repository IDs
        run: |
          echo "Repository: ${{ github.repository }}"
          cho "Owner ID: ${{ github.repository_owner_id }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Branch: ${{ github.ref }}"

  security:
    uses: ./.github/workflows/security.yml
    secrets: inherit